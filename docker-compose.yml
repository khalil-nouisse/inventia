services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventia}
      MYSQL_USER: ${MYSQL_USER:-inventia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inventia}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-inventia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-inventia123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-inventia}
      DB_USER: ${MYSQL_USER:-inventia}
      DB_PASSWORD: ${MYSQL_PASSWORD:-inventia}
      JWT_SECRET: ${JWT_SECRET:-InventIASecretKeyForJwtAccessAndRefreshTokens20252026}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://localhost:5174}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-inventia}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-inventia123}
      MINIO_BUCKET: ${MINIO_BUCKET:-inventia-submissions}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  mysql-data:
  minio-data:
